[project]
name = "gatekeeper-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "networkx>=3.7",
    "pydantic>=2.14.3",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "watchdog>=7.1.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-groq>=0.3.0",
]

[project.scripts]
gatekeeper = "gatekeeper_graph.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gatekeeper_graph"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tree_sitter_typescript", "tree_sitter_javascript", "networkx"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "langchain_core",
    "langchain_core.*",
    "langchain_ollama",
    "langchain_ollama.*",
    "langchain_groq",
    "langchain_groq.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ollama: calls a local Ollama server"]
